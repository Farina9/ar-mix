<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>موتور خودکار WebAR مبتنی بر MindAR و A-Frame</title>

    <!-- 
      لود کتابخانه‌های استاندارد از شبکه توزیع محتوا (CDN):
      نسخه ۱.۴.۲ فریم‌ورک A-Frame و نسخه ۱.۲.۲ کتابخانه MindAR سازگار با آن
    -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* حذف حاشیه‌های پیش‌فرض صفحه و جلوگیری از اسکرول خوردن در موبایل */
      body {
        margin: 0;
        overflow: hidden;
        font-family: Tahoma, sans-serif;
      }
    </style>

    <script>
      /**
       * کامپوننت اختصاصی drag-rotate:
       * فراهم کردن قابلیت چرخش دستی مدل‌های سه‌بعدی حول محورهای X و Y
       * با درگ ماوس در دسکتاپ یا لمس (Touch) روی نمایشگر موبایل.
       */
      AFRAME.registerComponent('drag-rotate', {
        init: function () {
          this.isDragging = false;
          this.prevPos = { x: 0, y: 0 };

          // شروع تعامل (لمس یا کلیک اولیه روی شیء)
          const onStart = (e) => {
            this.isDragging = true;
            this.prevPos = {
              x: e.touches ? e.touches[0].clientX : e.clientX,
              y: e.touches ? e.touches[0].clientY : e.clientY
            };
            // در صورت وجود انیمیشن چرخش خودکار، حین درگ دست متوقف می‌شود
            if (this.el.hasAttribute('animation')) {
              this.el.components.animation.pauseAnimation();
            }
          };

          // جابجایی دست/ماوس و اعمال چرخش زاویه‌ای به آبجکت
          const onMove = (e) => {
            if (!this.isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaX = x - this.prevPos.x;
            const deltaY = y - this.prevPos.y;

            const rot = this.el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
            this.el.setAttribute('rotation', {
              x: rot.x - deltaY * 0.4,
              y: rot.y + deltaX * 0.4,
              z: rot.z
            });
            this.prevPos = { x, y };
          };

          // پایان لمس یا رهاسازی ماوس
          const onEnd = () => {
            // ادامه چرخش خودکار پس از رها شدن شیء
            if (this.isDragging && this.el.hasAttribute('animation')) {
              this.el.components.animation.resumeAnimation();
            }
            this.isDragging = false;
          };

          // اتصال لیسنرها به المان و پنجره مرورگر
          this.el.addEventListener('mousedown', onStart);
          this.el.addEventListener('touchstart', onStart, { passive: true });
          window.addEventListener('mousemove', onMove);
          window.addEventListener('touchmove', onMove, { passive: true });
          window.addEventListener('mouseup', onEnd);
          window.addEventListener('touchend', onEnd);
        }
      });
    </script>
  </head>
  <body>
    <!-- 
      صحنه اصلی واقعیت افزوده:
      - autoStart: false تنظیم شده تا کنترل شروع دقیقاً پس از ساخت کامل المان‌ها با جاوااسکریپت انجام شود.
      - raycaster: امکان کلیک و لمس روی آیتم‌های حاوی کلاس clickable را فراهم می‌کند.
    -->
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1; autoStart: false;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >
      <!-- مخزن فایل‌های واسط (Assets) که به‌صورت پویا از طریق اسکریپت پر می‌شود -->
      <a-assets id="assets-box">
        <!-- آیکون پیش‌فرض پخش صوت در صورت مشخص نبودن کاور اختصاصی -->
        <img id="default-audio-icon" src="./assets/audio-icon.png" />
      </a-assets>

      <!-- دوربین صحنه جهت منطبق‌سازی واقعیت افزوده -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      // =========================================================================
      // بخش اول: مقادیر پیش‌فرض (DEFAULTS)
      // این مقادیر در صورت عدم تعیین ابعاد، موقعیت یا رفتار اختصاصی اعمال می‌شوند.
      // =========================================================================
      const DEFAULTS = {
        model: { scale: '0.1 0.1 0.1', pos: '0 0 0.1', autoRotate: true, touch: true },
        video: { scale: '1 0.56 1',    pos: '0 0 0.05' },
        audio: { scale: '0.6 0.6 1',   pos: '0 0 0.05' },
        image: { scale: '1 1.4 1',     pos: '0 0 0.05' },
        link:  { scale: '1 0.35 1',    pos: '0 -0.4 0.05', defaultIcon: './assets/btn-link.png' }
      };

      // =========================================================================
      // بخش دوم: دیتابیس تارگت‌ها (تنظیمات هر دسته در قالب آرایه ساده)
      // =========================================================================

      // ۱. مدل‌های ۳ بعدی: [اندیس_تارگت, مسیر_فایل_glb, مقیاس(اختیاری), مختصات(اختیاری), چرخش_خودکار(اختیاری), چرخش_با_لمس(اختیاری)]
      const modelTargets = [
          [0, './assets/model1.glb', true, true, '0.2 0.2 0.2']
      ];

      // ۲. ویدئوها: [اندیس_تارگت, مسیر_فایل_mp4, مقیاس(اختیاری), مختصات(اختیاری)]
      const videoTargets = [
        [1, './assets/video1.mp4', '1.2 0.68 1', '0 0 0.05']
      ];


      // =========================================================================
      // بخش سوم: موتور خودکار تولید المان‌های HTML و اتصال رویدادها
      // =========================================================================
      const scene = document.querySelector('#ar-scene');
      const assets = document.querySelector('#assets-box');

      // ساخت نگهدارنده اصلی تارگت در ساختار A-Frame
      function createTargetEntity(id) {
        const target = document.createElement('a-entity');
        target.setAttribute('mindar-image-target', `targetIndex: ${id}`);
        scene.appendChild(target);
        return target;
      }

      // الف) تولید و بارگذاری خودکار مدل‌های سه‌بعدی
      modelTargets.forEach(([id, file, scale, pos, autoRot, touch]) => {
        const tagId = `model-${id}`;
        assets.insertAdjacentHTML('beforeend', `<a-asset-item id="${tagId}" src="${file}"></a-asset-item>`);

        const target = createTargetEntity(id);
        const el = document.createElement('a-gltf-model');
        el.setAttribute('src', `#${tagId}`);
        el.setAttribute('scale', scale || DEFAULTS.model.scale);
        el.setAttribute('position', pos || DEFAULTS.model.pos);
        el.setAttribute('rotation', '0 0 0');

        const canAuto = autoRot !== undefined ? autoRot : DEFAULTS.model.autoRotate;
        const canTouch = touch !== undefined ? touch : DEFAULTS.model.touch;

        if (canAuto) {
          el.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear');
        }
        if (canTouch) {
          el.classList.add('clickable');
          el.setAttribute('drag-rotate', '');
        }
        target.appendChild(el);
      });

      // ب) تولید ویدئوها (همراه با ویژگی muted جهت عبور از سد autoplay در مرورگرهای موبایل)
      videoTargets.forEach(([id, file, scale, pos]) => {
        const tagId = `video-${id}`;
        assets.insertAdjacentHTML(
          'beforeend',
          `<video id="${tagId}" src="${file}" preload="auto" loop muted playsinline webkit-playsinline></video>`
        );

        const target = createTargetEntity(id);
        const el = document.createElement('a-video');
        el.setAttribute('src', `#${tagId}`);
        el.setAttribute('scale', scale || DEFAULTS.video.scale);
        el.setAttribute('position', pos || DEFAULTS.video.pos);

        // پخش با دیدن مارکر و توقف با خارج شدن از کادر دوربین
        target.addEventListener('targetFound', () => {
          const v = document.querySelector(`#${tagId}`);
          if (v) v.play().catch(() => {});
        });
        target.addEventListener('targetLost', () => {
          const v = document.querySelector(`#${tagId}`);
          if (v) v.pause();
        });
        target.appendChild(el);
      });

      // ج) تولید صوت‌ها و کنترل پخش بر اساس دیده‌شدن مارکر
      audioTargets.forEach(([id, file, cover]) => {
        const tagId = `audio-${id}`;
        assets.insertAdjacentHTML('beforeend', `<audio id="${tagId}" src="${file}" preload="auto"></audio>`);

        const target = createTargetEntity(id);
        const el = document.createElement('a-image');
        el.setAttribute('src', cover || '#default-audio-icon');
        el.setAttribute('scale', DEFAULTS.audio.scale);
        el.setAttribute('position', DEFAULTS.audio.pos);

        target.addEventListener('targetFound', () => {
          const a = document.querySelector(`#${tagId}`);
          if (a) a.play().catch(() => {});
        });
        target.addEventListener('targetLost', () => {
          const a = document.querySelector(`#${tagId}`);
          if (a) a.pause();
        });
        target.appendChild(el);
      });

      // د) تولید تصاویر و پوسترهای ثابت
      imageTargets.forEach(([id, file, scale, pos]) => {
        const tagId = `img-${id}`;
        assets.insertAdjacentHTML('beforeend', `<img id="${tagId}" src="${file}">`);

        const target = createTargetEntity(id);
        const el = document.createElement('a-image');
        el.setAttribute('src', `#${tagId}`);
        el.setAttribute('scale', scale || DEFAULTS.image.scale);
        el.setAttribute('position', pos || DEFAULTS.image.pos);
        target.appendChild(el);
      });

      // هـ) تولید دکمه‌های قابل لمس برای انتقال به لینک‌های خارجی
      linkTargets.forEach(([id, url, btnImg, scale, pos]) => {
        const target = createTargetEntity(id);
        const el = document.createElement('a-image');
        el.setAttribute('src', btnImg || DEFAULTS.link.defaultIcon);
        el.setAttribute('scale', scale || DEFAULTS.link.scale);
        el.setAttribute('position', pos || DEFAULTS.link.pos);
        el.classList.add('clickable');

        // باز شدن پیوند در برگه جدید با کلیک روی المان
        el.addEventListener('click', () => {
          window.open(url, '_blank');
        });
        target.appendChild(el);
      });

      // =========================================================================
      // بخش چهارم: فعال‌سازی آنی دوربین بلافاصله پس از بارگذاری صفحه
      // =========================================================================
      function startCameraImmediately() {
        const arSystem = scene.systems['mindar-image-system'];
        if (arSystem) {
          // فراخوانی مستقیم متد start برای درخواست مجوز و اجرای بلافاصله وب‌کم
          arSystem.start();
        }
      }

      // اجرای تابع پس از لود کامل ساختار تگ‌های صحنه و دارایی‌ها
      if (scene.hasLoaded) {
        startCameraImmediately();
      } else {
        scene.addEventListener('loaded', startCameraImmediately);
      }

      // حذف حالت بی‌صدا (Unmute) از تمامی مدیاها در اولین لمس تصادفی صفحه توسط کاربر
      window.addEventListener(
        'touchstart',
        () => {
          document.querySelectorAll('video').forEach((v) => {
            v.muted = false;
          });
        },
        { once: true }
      );
    </script>
  </body>
</html>
